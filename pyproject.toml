[project]
name = "ampav-qwen"
version = "0.0.1"
description = "Qwen model tooling for the AMPAV environment"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
]
authors = [
    {name = "Ying Feng", email = "yingfeng@iu.edu"},
]

requires-python = ">=3.12"
dependencies = [
    "ampav-core>=0.0.20",
    "accelerate>=1.0",
    "torch>=2.7",
    "transformers>=5.2.0",
]

[project.optional-dependencies]
omni = [
    "audioread>=3.0",
    "librosa<1.0",
    "qwen-omni-utils[decord]>=0.0.8",
]
openvino = [
    "openvino-genai==2026.4.0.0",
]
vllm-client = [
    "openai>=2.0",
]

[project.urls]
Homepage = "https://github.com/AMPAV/ampav-qwen"
Repository = "https://github.com/AMPAV/ampav-qwen.git"
Issues = "https://github.com/AMPAV/ampav-qwen/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ampav*"]
namespaces = true

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
